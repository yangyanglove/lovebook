<!-- 极简 JS：开始阅读后隐藏顶部返回 -->
<script>
  const header = document.querySelector('.issue-header');
  let hidden = false;

  window.addEventListener('scroll', () => {
    if (!hidden && window.scrollY > 40) {
      header.classList.add('hidden');
      hidden = true;
    }
  });
</script>
